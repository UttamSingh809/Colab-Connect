<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Projects — ColabConnect</title>
  <link rel="stylesheet" href="/css/styles.css?v=5">
  <style>
    .project-detail-modal { max-width: 620px; width: 95vw; }
    .members-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
    .member-chip { display:flex; align-items:center; gap:8px; background:var(--bg-secondary); border-radius:20px; padding:4px 12px 4px 4px; }
    .member-chip-avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--teams-purple),#8385c7); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .member-chip-name { font-size:12px; font-weight:600; color:var(--text-primary); }
    .member-chip-role { font-size:11px; color:var(--text-muted); }
    .status-pill { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .status-pill.open { background:#e8f5e9; color:#2e7d32; }
    .status-pill.in_progress { background:#e3f2fd; color:#1565c0; }
    .status-pill.completed { background:#f3e5f5; color:#6a1b9a; }
    .filter-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
    .search-bar-lg { flex:1; min-width:200px; padding:10px 16px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; background:var(--bg-primary); color:var(--text-primary); outline:none; }
    .search-bar-lg:focus { border-color:var(--teams-purple); }
    .discover-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; }
    .proj-card { background:var(--bg-primary); border:1px solid var(--border); border-radius:12px; padding:18px; cursor:pointer; transition:box-shadow .15s,transform .12s; }
    .proj-card:hover { box-shadow:0 4px 16px rgba(98,100,167,.18); transform:translateY(-2px); }
    .proj-card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .proj-type-badge { font-size:10px; font-weight:700; background:rgba(98,100,167,.12); color:var(--teams-purple); padding:3px 8px; border-radius:10px; }
    .proj-card-name { font-size:15px; font-weight:700; color:var(--text-primary); margin-bottom:6px; }
    .proj-card-desc { font-size:12px; color:var(--text-secondary); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:10px; }
    .proj-card-meta { display:flex; align-items:center; gap:12px; font-size:11px; color:var(--text-muted); flex-wrap:wrap; }
    .join-req-section { background:var(--bg-secondary); border-radius:10px; padding:14px; margin-top:16px; }
    .join-req-title { font-size:13px; font-weight:700; margin-bottom:8px; color:var(--text-primary); }
    .detail-section { margin-top:14px; }
    .detail-label { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  </style>
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{layout :: left-panel}"></div>
  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Discover Projects</div>
        <div class="page-subtitle">Browse open projects and request to join</div>
      </div>
      <div class="page-actions">
        <a href="/projects.html" class="btn btn-primary">+ My Projects</a>
      </div>
    </div>
    <div class="page-body">
      <div class="filter-bar">
        <input class="search-bar-lg" id="proj-search" placeholder="Search by name, description, or skills…" oninput="filterProjects()">
        <select class="form-select" id="filter-type" onchange="filterProjects()" style="width:150px">
          <option value="">All Types</option>
          <option value="Web App">Web App</option>
          <option value="Mobile App">Mobile App</option>
          <option value="Open Source">Open Source</option>
          <option value="Research">Research</option>
          <option value="Startup">Startup</option>
          <option value="Web3">Web3</option>
        </select>
        <select class="form-select" id="filter-status" onchange="filterProjects()" style="width:140px">
          <option value="">All Statuses</option>
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
        <span id="projects-count" class="text-sm text-secondary" style="white-space:nowrap"></span>
      </div>      
      <!-- Popular skills quick-filter -->
      <div style="margin-bottom:20px;padding-top:12px;border-top:1px solid var(--border)">
        <span class="text-sm text-secondary" style="margin-right:8px">Popular skills:</span>
        <div style="display:inline-flex;flex-wrap:wrap;gap:6px" id="skill-filters">
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('Java')">Java</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('Python')">Python</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('React')">React</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('Node.js')">Node.js</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('ML/AI')">ML/AI</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('AWS')">AWS</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('Kotlin')">Kotlin</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('Figma')">Figma</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('Go')">Go</span>
          <span class="tag" style="cursor:pointer" onclick="filterBySkill('Solidity')">Solidity</span>
        </div>
      </div>
      <div class="discover-grid" id="discover-grid">
        <div class="loading"><div class="spinner"></div> Loading projects…</div>
      </div>
    </div>
  </div>
</div>

<!-- Project Detail Modal -->
<div class="modal-overlay" id="project-detail-modal">
  <div class="modal project-detail-modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="detail-name"></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <span id="detail-type-badge" class="proj-type-badge"></span>
          <span id="detail-status-pill"></span>
        </div>
      </div>
      <button class="btn-icon" onclick="closeModal('project-detail-modal')"><box-icon name="x" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon></button>
    </div>
    <div class="modal-body" style="max-height:65vh;overflow-y:auto">
      <p id="detail-desc" style="color:var(--text-secondary);font-size:13px;line-height:1.6;margin-bottom:0"></p>

      <div class="detail-section">
        <div class="detail-label">Project Owner</div>
        <div id="detail-owner" style="font-size:13px;font-weight:600;color:var(--text-primary)"></div>
      </div>

      <div class="detail-section" id="detail-skills-section">
        <div class="detail-label">Skills Needed</div>
        <div class="tags" id="detail-skills"></div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Team Members (<span id="detail-member-count">0</span>)</div>
        <div class="members-row" id="detail-members"></div>
      </div>

      <div id="join-section"></div>
    </div>
  </div>
</div>

<!-- Join Request Modal -->
<div class="modal-overlay" id="join-request-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Request to Join <span id="join-project-name"></span></div>
      <button class="btn-icon" onclick="closeModal('join-request-modal')"><box-icon name="x" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Introduce yourself (optional)</label>
        <textarea class="form-input" id="join-message" rows="3" maxlength="500"
          placeholder="Tell the project owner why you'd be a great fit…" style="resize:vertical"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('join-request-modal')">Cancel</button>
      <button class="btn btn-primary" id="join-confirm-btn" onclick="confirmJoin()"><box-icon name="envelope-open" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon> Send Request</button>
    </div>
  </div>
</div>

<script src="/js/app.js?v=5"></script>
<script src="/js/discover-projects.js"></script>
<div th:replace="~{layout :: project-modal}"></div>
</body>
</html>
