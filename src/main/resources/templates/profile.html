<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — ColabConnect</title>
  <link rel="stylesheet" href="/css/styles.css?v=5">
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{layout :: left-panel}"></div>
  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title" id="page-title-text">Profile</div>
      </div>
      <div class="page-actions" id="profile-actions"></div>
    </div>
    <div class="page-body">
      <div id="profile-content"><div class="loading"><div class="spinner"></div> Loading profile...</div></div>
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Edit Profile</div>
      <button class="btn-icon" onclick="closeModal('edit-modal')"><box-icon name="x" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="edit-name" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Title / Role</label>
        <input type="text" id="edit-title" class="form-input" placeholder="e.g. Full-Stack Developer">
      </div>
      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea id="edit-bio" class="form-textarea" placeholder="Tell collaborators about yourself..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">GitHub URL</label>
          <input type="url" id="edit-github" class="form-input" placeholder="https://github.com/you">
        </div>
        <div class="form-group">
          <label class="form-label">Portfolio URL</label>
          <input type="url" id="edit-portfolio" class="form-input" placeholder="https://yoursite.com">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Availability</label>
          <select id="edit-avail" class="form-select">
            <option value="available">Available</option>
            <option value="weekends">Weekends only</option>
            <option value="limited">Limited</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Work Style</label>
          <select id="edit-style" class="form-select">
            <option value="async-friendly">Async-Friendly</option>
            <option value="collaborative">Collaborative</option>
            <option value="structured">Structured</option>
            <option value="flexible">Flexible</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Skills (comma-separated)</label>
        <input type="text" id="edit-skills" class="form-input" placeholder="Java, Spring Boot, React...">
        <div id="skills-preview" class="tags" style="margin-top:8px"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Project Types (comma-separated)</label>
        <input type="text" id="edit-project-types" class="form-input" placeholder="Web App, Mobile, AI/ML...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('edit-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveProfile()" id="save-btn">Save Changes</button>
    </div>
  </div>
</div>

<script src="/js/app.js?v=5"></script>
<script src="/js/profile.js"></script>
<div th:replace="~{layout :: project-modal}"></div>
</body>
</html>
