<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — ColabConnect</title>
  <link rel="stylesheet" href="/css/styles.css?v=5">
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{layout :: left-panel}"></div>
  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Projects</div>
        <div class="page-subtitle">Manage and explore collaboration projects</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary" id="scope-btn" onclick="toggleScope()"><box-icon name="globe" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon> Browse All</button>
        <button class="btn btn-primary" onclick="openModal('new-project-modal')">+ New Project</button>
      </div>
    </div>
    <div class="page-body">
      <div class="filters-bar" style="padding:0;margin-bottom:16px">
        <div class="search-bar">
          <span class="search-icon"><box-icon name="group" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px;"></box-icon></span>
          <input type="text" id="project-search" placeholder="Search projects..." oninput="filterProjects()">
        </div>
        <div class="filter-group">
          <label class="filter-label">Status</label>
          <select class="filter-select" id="filter-status" onchange="filterProjects()">
            <option value="">All</option>
            <option value="open">Open</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Type</label>
          <select class="filter-select" id="filter-type" onchange="filterProjects()">
            <option value="">All</option>
            <option value="Web App">Web App</option>
            <option value="Mobile">Mobile</option>
            <option value="AI/ML">AI/ML</option>
            <option value="Open Source">Open Source</option>
            <option value="DevOps">DevOps</option>
            <option value="Web3">Web3</option>
            <option value="Research">Research</option>
          </select>
        </div>
      </div>
      <div id="projects-count" class="text-sm text-secondary mb-16"></div>
      <div id="projects-grid" class="project-grid">
        <div class="loading"><div class="spinner"></div> Loading projects...</div>
      </div>
    </div>
  </div>
</div>

<!-- New Project Modal -->
<div class="modal-overlay" id="new-project-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Create New Project</div>
      <button class="btn-icon" onclick="closeModal('new-project-modal')"><box-icon name="x" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Project Name *</label>
        <input type="text" id="new-name" class="form-input" placeholder="My Awesome Project">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="new-desc" class="form-textarea" placeholder="Describe your project and what kind of collaborators you need..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Project Type</label>
          <select id="new-type" class="form-select">
            <option value="Web App">Web App</option>
            <option value="Mobile">Mobile</option>
            <option value="AI/ML">AI/ML</option>
            <option value="Open Source">Open Source</option>
            <option value="DevOps">DevOps</option>
            <option value="Web3">Web3</option>
            <option value="Startup">Startup</option>
            <option value="Research">Research</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="new-status" class="form-select">
            <option value="open">Open (Seeking collaborators)</option>
            <option value="active">Active</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Required Skills (comma-separated)</label>
        <input type="text" id="new-skills" class="form-input" placeholder="React, Python, Docker...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('new-project-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="createProject()" id="create-btn">Create Project</button>
    </div>
  </div>
</div>

<!-- Join Request Modal -->
<div class="modal-overlay" id="join-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Request to Join</div>
      <button class="btn-icon" onclick="closeModal('join-modal')"><box-icon name="x" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon></button>
    </div>
    <div class="modal-body">
      <p class="text-secondary" style="margin-bottom:12px">Send a join request to <strong id="join-project-name"></strong>. The project owner will review and can accept or decline.</p>
      <div class="form-group">
        <label class="form-label">Message (optional)</label>
        <textarea id="join-message" class="form-textarea" placeholder="Introduce yourself and explain how you can contribute..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('join-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitJoinRequest()" id="join-btn">Send Request</button>
    </div>
  </div>
</div>

<script src="/js/app.js?v=5"></script>
<script src="/js/projects.js"></script>

<!-- Rate Teammates Modal -->
<div class="modal-overlay" id="rate-modal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title"><box-icon name="star" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px;"></box-icon> Rate Teammates</div>
        <div class="text-sm text-secondary" id="rating-project-name"></div>
      </div>
      <button class="btn-icon" onclick="closeModal('rate-modal')"><box-icon name="x" animation="tada-hover" color="currentColor" style="width: 16px; height: 16px; vertical-align: middle;"></box-icon></button>
    </div>
    <div class="modal-body">
      <div id="rating-teammates-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('rate-modal')">Cancel</button>
      <button class="btn btn-primary" id="rating-submit-btn" onclick="submitRating()">Submit Rating</button>
    </div>
  </div>
</div>
<div th:replace="~{layout :: project-modal}"></div>
</body>
</html>
