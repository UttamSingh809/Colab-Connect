kind = "web"
previewPath = "/"
title = "ColabConnect"
version = "1.0.0"
id = "artifacts/colab-connect"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20143

[services.development]
run = "java -jar /home/runner/workspace/artifacts/colab-connect/target/colab-connect-0.0.1-SNAPSHOT.jar"

[services.production]
build = [ "sh", "-c", "cd /home/runner/workspace/artifacts/colab-connect && mvn package -DskipTests" ]
run = "java -jar /home/runner/workspace/artifacts/colab-connect/target/colab-connect-0.0.1-SNAPSHOT.jar"

[services.env]
PORT = "20143"
